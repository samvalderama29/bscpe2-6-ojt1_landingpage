<body>

            <a href="directory.html" class="active">STUDENT DIRECTORY</a>
        </nav>
    </header>

    <!-- ========== MAIN DIRECTORY ========== -->
    <main class="directory-page" id="directory-page">
        <!-- Subtle grid background -->
        <div class="grid-bg" aria-hidden="true"></div>

        <!-- Letter filter button -->
        <button class="letter-filter-btn" id="letter-filter-btn" type="button" aria-label="Filter students by letter">
            NAMES: A-Z
        </button>

        <!-- Current letter indicator -->
        <div class="current-letter" id="current-letter" aria-live="polite">A</div>

        <!-- Student cards with navigation arrows -->
        <section class="cards-section" id="cards-section" aria-label="Student cards">
            <button class="nav-arrow left hidden" id="arrow-left" type="button" aria-label="Previous students">&lt;</button>
            <div class="cards-container" id="cards-container">
                <!-- Student cards rendered by JS -->
            </div>
            <button class="nav-arrow right hidden" id="arrow-right" type="button" aria-label="Next students">&gt;</button>
        </section>
    </main>

    <!-- ========== LETTER OVERLAY ========== -->
    <div class="letter-overlay" id="letter-overlay" role="dialog" aria-modal="true" aria-label="Select a letter to filter students">
        <div class="letter-panel" id="letter-panel">
            <div class="letter-grid" id="letter-grid">
                <!-- Letter cells rendered by JS -->
            </div>
        </div>
    </div>
